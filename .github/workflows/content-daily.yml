name: "Content Factory: daily publish"

on:
  schedule:
    - cron: "0 14 * * *"   # every day 14:00 UTC — adjust to your audience's peak time
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional: add this topic to the queue before running"
        required: false
      count:
        description: "How many videos to produce this run"
        required: false
        default: "1"
      dry:
        description: "Dry run (render only, no publishing)"
        required: false
        default: "false"

concurrency:
  group: content-factory
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install ffmpeg and fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Install dependencies
        run: npm ci --omit=dev --ignore-scripts

      - name: Add topic from manual trigger
        if: ${{ github.event.inputs.topic != '' && github.event.inputs.topic != null }}
        run: node content-factory/cli.js add "${{ github.event.inputs.topic }}"

      - name: Produce and publish
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          TT_ACCESS_TOKEN: ${{ secrets.TT_ACCESS_TOKEN }}
          CHANNEL_NAME: ${{ vars.CHANNEL_NAME }}
          CHANNEL_NICHE: ${{ vars.CHANNEL_NICHE }}
          CHANNEL_LANGUAGE: ${{ vars.CHANNEL_LANGUAGE }}
          CHANNEL_TONE: ${{ vars.CHANNEL_TONE }}
        run: |
          FLAGS="--count ${{ github.event.inputs.count || '1' }}"
          if [ "${{ github.event.inputs.dry }}" = "true" ]; then FLAGS="$FLAGS --dry"; fi
          node content-factory/cli.js run $FLAGS

      - name: Upload rendered videos as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-videos
          path: content-factory/data/**/final.mp4
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit queue and publish history
        run: |
          git config user.name "content-factory-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content-factory/queue.json content-factory/published.json content-factory/REPORT.md
          git diff --cached --quiet || git commit -m "chore(content-factory): update queue and publish history [skip ci]"
          git push
